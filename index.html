<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сделать фото</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    video, img {
      width: 100%;
      max-width: 450px;
      border-radius: 12px;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    #camera {
      background: #222;
      color: white;
    }

    #photo {
      background: #1677ff;
      color: white;
    }

    #send {
      background: #20a050;
      color: white;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📷 Сделать фотографию</h2>

  <p>
    Для продолжения необходимо разрешить доступ к камере.
  </p>

  <button id="camera">
    Разрешить камеру
  </button>

  <video id="video" autoplay playsinline hidden></video>

  <button id="photo" hidden>
    Сделать фото
  </button>

  <canvas id="canvas" hidden></canvas>

  <img id="preview" hidden>

  <button id="send" hidden>
    Отправить фото
  </button>

  <div id="status"></div>

</div>

<script>

const cameraButton = document.getElementById("camera");
const photoButton = document.getElementById("photo");
const sendButton = document.getElementById("send");

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");

const status = document.getElementById("status");

let stream = null;
let photoBlob = null;


// Разрешение камеры
cameraButton.onclick = async () => {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;

    video.hidden = false;
    photoButton.hidden = false;

    cameraButton.hidden = true;

    status.textContent = "Камера включена.";

  } catch (error) {

    status.textContent =
      "Не удалось получить доступ к камере.";

    console.error(error);
  }
};


// Сделать фотографию
photoButton.onclick = () => {

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const context = canvas.getContext("2d");

  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob((blob) => {

    photoBlob = blob;

    preview.src = URL.createObjectURL(blob);

    preview.hidden = false;
    sendButton.hidden = false;

    status.textContent =
      "Фото готово. Проверьте его перед отправкой.";

  }, "image/jpeg", 0.9);

};


// Отправка
sendButton.onclick = async () => {

  if (!photoBlob) {
    return;
  }

  status.textContent = "Отправка...";

  const formData = new FormData();

  formData.append(
    "photo",
    photoBlob,
    "photo.jpg"
  );

  try {

    const response = await fetch(
      "https://ТВОЙ-БЭКЕНД/ upload",
      {
        method: "POST",
        body: formData
      }
    );

    if (!response.ok) {
      throw new Error("Ошибка отправки");
    }

    status.textContent =
      "Фото успешно отправлено.";

  } catch (error) {

    status.textContent =
      "Не удалось отправить фото.";

    console.error(error);
  }

};

</script>

</body>
</html>
